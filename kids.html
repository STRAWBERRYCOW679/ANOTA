<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATONA — Kid’s Collection</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-outer: #26482b;
      --bg-hero-top: #466847;
      --bg-hero-bottom: #608561;
      --text-white: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.85);
      --accent-dot: #d6c86b;
      --dark-pill: #335235;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-outer);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 48px 96px;
    }

    .page-wrapper {
      width: 100%;
      background: linear-gradient(180deg, var(--bg-hero-top) 0%, var(--bg-hero-bottom) 100%);
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      padding: 36px 64px 56px 64px;
      color: var(--text-white);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 48px;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: flex;
      align-items: baseline;
      text-decoration: none;
      color: var(--text-white);
    }

    .logo span {
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: var(--accent-dot);
      border-radius: 50%;
      margin-left: 3px;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 32px;
    }

    nav a {
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.8px;
      transition: color 0.2s;
    }

    nav a:hover, nav a.active {
      color: var(--text-white);
      font-weight: 700;
    }

    .nav-icons {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .nav-icons svg {
      width: 19px;
      height: 19px;
      stroke: var(--text-white);
      fill: none;
      stroke-width: 1.8;
      cursor: pointer;
    }

    .collection-banner {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 40px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 24px;
    }

    .collection-banner h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .collection-banner p {
      max-width: 380px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .product-card {
      background: var(--text-white);
      border-radius: 18px;
      padding: 16px;
      color: #1a241b;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.25s ease;
    }

    .product-card:hover {
      transform: translateY(-6px);
    }

    .product-img {
      width: 100%;
      height: 290px;
      border-radius: 12px;
      overflow: hidden;
      background: #e5e8e5;
      margin-bottom: 16px;
    }

    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .product-info h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .product-info span {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--dark-pill);
    }

    .add-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--dark-pill);
      border: none;
      color: var(--text-white);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .add-btn svg {
      width: 18px;
      height: 18px;
      stroke: var(--text-white);
      stroke-width: 2.2;
      fill: none;
    }

    @media (max-width: 992px) {
      body { padding: 24px; }
      .page-wrapper { padding: 28px 24px 36px 24px; }
      nav { display: none; }
      .collection-banner { flex-direction: column; align-items: flex-start; gap: 12px; }
      .product-grid { grid-template-columns: 1fr; }
    }

         .floating-home {
      position: fixed;
      bottom: 32px;
      right: 32px;
      background-color: var(--text-white);
      color: var(--dark-pill);
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 50px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      z-index: 100;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .floating-home:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.35);
    }

    .floating-home svg {
      width: 18px;
      height: 18px;
      stroke: var(--dark-pill);
      stroke-width: 2.2;
      fill: none;
    }

  </style>
</head>
<body>

  <div class="page-wrapper">
    <header>
      <a href="index.html" class="logo">ATONA<span></span></a>
      <nav>
        <ul>
          
          <li><a href="men.html">MEN’S</a></li>
          <li><a href="women.html">WOMEN’S</a></li>
          <li><a href="kids.html" class="active">KID’S</a></li>
        </ul>
      </nav>
      <div class="nav-icons">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.2" y2="16.2"/></svg>
        <svg viewBox="0 0 24 24"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg>
      </div>
    </header>

    <section class="collection-banner">
      <div>
        <h1>Kid’s Collection</h1>
      </div>
      <p>Gentle, undyed organic fabrics and playful everyday cuts built for movement and softness.</p>
    </section>

    <section class="product-grid">
      <div class="product-card">
        <div class="product-img">
          <img src="images/kin-li-du2JnmcSvX0-unsplash.jpg" alt="Organic Cotton Co-ord Set" />
        </div>
        <div class="product-meta">
          <div class="product-info">
            <h3>Organic Cotton Co-ord Set</h3>
            <span>$48.00</span>
          </div>
          <button class="add-btn" aria-label="Add to bag">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>

      <div class="product-card">
        <div class="product-img">
          <img src="images/modupe-falade-BayzMQkraW4-unsplash (1).jpg" alt="Soft Knit Pullover" />
        </div>
        <div class="product-meta">
          <div class="product-info">
            <h3>Soft Knit Pullover</h3>
            <span>$42.00</span>
          </div>
          <button class="add-btn" aria-label="Add to bag">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>

      <div class="product-card">
        <div class="product-img">
          <img src="images/kayan-baby-kPXq-jxhMkk-unsplash.jpg" alt="classic red midi dress" />
        </div>
        <div class="product-meta">
          <div class="product-info">
            <h3>Everyday Drawstring Joggers</h3>
            <span>$36.00</span>
          </div>
          <button class="add-btn" aria-label="Add to bag">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>
    </section>
  </div>
 <a href="index.html" class="floating-home" aria-label="Return to Home">
    <svg viewBox="0 0 24 24">
      <path d="M3 10.5L12 3l9 7.5" />
      <path d="M5 9.5V20h14V9.5" />
    </svg>
    HOME
  </a>
</body>
</html>
